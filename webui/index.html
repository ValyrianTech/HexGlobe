<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HexGlobe 3D</title>
    <link rel="icon" type="image/png" href="data/static/images/hexglobe_logo.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="main-container">
        <div id="globe-container">
            <canvas id="globe-canvas"></canvas>
        </div>
        <div id="tile-view-container">
            <canvas id="tile-canvas"></canvas>
            <div id="tile-view-placeholder">
                <p>Select a tile to view</p>
            </div>
        </div>
    </div>
    
    <div id="info-panel" class="panel">
        <h2>HexGlobe 3D</h2>
        <div id="tile-info">
            <p>Click on a hexagon to view details</p>
            <p class="hint">Ctrl+click to select multiple tiles</p>
        </div>
        <div id="selection-info" style="display: none;">
            <p><strong>Selected:</strong> <span id="selection-count">0</span> tiles</p>
            <button id="generate-maps-btn" class="action-btn">Generate Maps</button>
            <button id="clear-selection-btn" class="action-btn secondary">Clear Selection</button>
            <div id="generation-status" style="display: none;"></div>
        </div>
        <div id="controls">
            <div class="control-group">
                <label for="resolution-select">Resolution:</label>
                <select id="resolution-select">
                    <option value="0" selected>0 (Largest)</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                    <option value="13">13</option>
                    <option value="14">14</option>
                    <option value="15">15 (Smallest)</option>
                </select>
            </div>
            <div class="control-group">
                <label>
                    <input type="checkbox" id="show-all-hexagons" checked>
                    Show all hexagons
                </label>
            </div>
        </div>
    </div>
    
    <div id="loading-overlay">
        <div class="spinner"></div>
        <p>Loading globe...</p>
    </div>

    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Application Scripts -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/hexagonUtils.js"></script>
    <script src="js/globe.js"></script>
    <script src="js/tileView.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
